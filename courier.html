<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10231d"><title>T-AWAY 送遞員後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script>
<style>
:root{--ink:#10231d;--muted:#6f7d75;--paper:#f7f8f3;--card:#fff;--line:#e2e9e2;--lime:#bbf05d;--mint:#d8f1db;--orange:#ef7d50;--blue:#e4f2fb;--red:#d9584c;--shadow:0 15px 38px #12302218}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(420px,100%);padding:31px 24px;border:1px solid var(--line);border-radius:25px;background:#fff;box-shadow:var(--shadow);text-align:center}.logo{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 16px;border-radius:19px;background:var(--ink);color:var(--lime);font-size:29px;box-shadow:5px 5px #d8ebd8}.login h1{margin:0 0 8px;font-size:25px;letter-spacing:-.07em}.login p{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.6}.input{width:100%;margin-top:8px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;outline:0;background:#fff;color:var(--ink);font-size:13px}.primary{padding:12px 16px;border-radius:11px;background:var(--lime);color:var(--ink);font-weight:900}.login .primary{width:100%;margin-top:12px}.error{margin-top:11px;color:var(--red);font-size:11px}.page{max-width:850px;margin:auto;padding:0 16px 55px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;background:#f7f8f3e8;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:9px;font-weight:900}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--lime);font-size:21px}.brand small{display:block;margin-top:2px;color:var(--orange);font-size:9px;letter-spacing:.12em}.top-actions{display:flex;gap:7px}.ghost{padding:9px 12px;border-radius:10px;background:#edf3ed;color:var(--ink);font-size:11px;font-weight:900}.welcome{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:17px 0 20px}.welcome h1{margin:0;font-size:29px;letter-spacing:-.07em}.welcome p{margin:7px 0 0;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:17px}.stat{padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--card)}.stat small{color:var(--muted);font-size:10px;font-weight:800}.stat strong{display:block;margin-top:5px;font-size:23px}.section{padding:17px;margin-top:17px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:0 6px 18px #12302208}.section-head{display:flex;align-items:start;justify-content:space-between;gap:10px;margin-bottom:14px}.section h2{margin:0;font-size:19px;letter-spacing:-.05em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.order-list{display:grid;gap:10px}.order-row{padding:13px;border:1px solid var(--line);border-radius:14px}.order-row.available{border-color:#c3e59a;box-shadow:0 0 0 2px #bbf05d44}.order-top{display:flex;justify-content:space-between;gap:10px}.order-top strong{font-size:13px}.order-top small{display:block;margin-top:4px;color:var(--muted);font-size:9px}.pill{padding:5px 7px;border-radius:7px;background:#fff1bc;color:#6d5a13;font-size:9px;font-weight:900;white-space:nowrap}.pill.preparing{background:#e4f4e4;color:#3c6d4c}.pill.delivering{background:var(--blue);color:#315d79}.pill.completed{background:#d9f1df;color:#456450}.items{margin:10px 0;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}.meta{display:grid;gap:5px;color:var(--muted);font-size:11px}.meta b{color:var(--ink);font-weight:800}.order-actions{display:flex;gap:7px;margin-top:12px}.order-actions button{flex:1;padding:10px;border-radius:9px;background:#edf3ed;color:var(--ink);font-size:11px;font-weight:900}.order-actions .claim{background:var(--lime)}.order-actions .done{background:var(--ink);color:#fff}.empty{padding:31px 10px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:12px}.notice{padding:12px 13px;border-radius:12px;background:var(--mint);color:#4a6b56;font-size:10px;line-height:1.6}.toast{position:fixed;z-index:10;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;padding:11px 14px;border-radius:11px;background:var(--ink);color:#fff;font-size:11px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:620px){.page{padding-left:13px;padding-right:13px}.top-actions .ghost:first-child{display:none}.welcome{align-items:start;flex-direction:column}.welcome h1{font-size:27px}.stats{gap:7px}.stat{padding:12px 10px}.stat strong{font-size:20px}.section{padding:14px}}
</style></head>
<body>
<div id="loginView" class="login"><section class="login-card"><div class="logo">🛵</div><h1>T-AWAY 送遞員後台</h1><p>請使用管理員建立的送遞員 Supabase 帳戶登入。<br>每位送遞員只能看到可接訂單及自己已接的訂單。</p><input id="email" class="input" type="email" placeholder="送遞員 Email" autocomplete="email"><input id="password" class="input" type="password" placeholder="密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="primary" onclick="login()">登入送遞員後台</button><div id="loginError" class="error" style="display:none"></div></section></div>
<div id="app" style="display:none"><main class="page"><header class="top"><div class="brand"><div class="mark">🛵</div><div>天水圍人車隊<small>T-AWAY · 送遞員後台</small></div></div><div class="top-actions"><button class="ghost" onclick="window.open('./index.html','_blank')">查看前台 ↗</button><button class="ghost" onclick="logout()">登出</button></div></header><section class="welcome"><div><h1 id="welcomeTitle">早晨，送遞員 👋</h1><p>看到可配送訂單後，按「接單配送」；每張訂單只會由一位送遞員接到。</p></div></section><div class="stats"><div class="stat"><small>可接訂單</small><strong id="statAvailable">0</strong></div><div class="stat"><small>我的配送中</small><strong id="statMine">0</strong></div><div class="stat"><small>我已完成</small><strong id="statDone">0</strong></div></div><section class="section"><div class="section-head"><div><h2>可接配送</h2><p>餐廳已確認或正在準備中的訂單。</p></div></div><div id="availableList" class="order-list"></div></section><section class="section"><div class="section-head"><div><h2>我的配送</h2><p>你接下的訂單會在這裡顯示。</p></div></div><div id="mineList" class="order-list"></div></section><section class="section"><div class="section-head"><div><h2>已完成紀錄</h2><p>最近完成的配送訂單。</p></div></div><div id="doneList" class="order-list"></div></section><div class="notice" style="margin-top:17px">提示：接單時系統會在資料庫即時鎖定訂單。如果另一位送遞員比你早一步接單，這張單會自動從你的可接清單消失。</div></main></div><div id="toast" class="toast"></div>
<script>
const db=window.supabase?.createClient(window.TAWAY_SUPABASE_URL,window.TAWAY_SUPABASE_PUBLISHABLE_KEY);let user=null,profile=null,channel=null,orders=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const statusLabel=s=>({pending:'待確認',confirmed:'餐廳已確認',preparing:'準備中',delivering:'配送中',completed:'已完成',cancelled:'已取消'})[s]||s||'未知';
function showError(msg){const e=document.getElementById('loginError');e.textContent=msg;e.style.display='block'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('loginError').style.display='none';if(!email||!password||!db){showError('請輸入 Email 和密碼。');return}const result=await db.auth.signInWithPassword({email,password});if(result.error){showError('登入失敗，請檢查 Email 和密碼。');return}user=result.data.user;const {data,error}=await db.from('staff_profiles').select('user_id,role,display_name,phone,active').eq('user_id',user.id).maybeSingle();if(error||!data||data.role!=='courier'||!data.active){await db.auth.signOut();showError('此帳戶不是已啟用的送遞員帳戶，請聯絡管理員。');return}profile=data;document.getElementById('loginView').style.display='none';document.getElementById('app').style.display='block';document.getElementById('welcomeTitle').textContent=`早晨，${profile.display_name||'送遞員'} 👋`;await loadOrders();subscribe()}
async function loadOrders(){if(!db||!user)return;const {data,error}=await db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error){toast('未能讀取配送訂單');console.error(error);return}orders=data||[];render()}
function formatItems(o){return(o.order_items||[]).map(x=>`${esc(x.item_name)} × ${x.quantity}`).join('、')||'沒有餐點資料'}
function orderCard(o,mode){const mine=o.assigned_courier_id===user.id,available=!o.assigned_courier_id&&['confirmed','preparing'].includes(o.status);let action='';if(available)action=`<button class="claim" onclick="claimOrder('${o.id}')">接單配送</button>`;if(mine&&o.status==='delivering')action=`<button class="done" onclick="completeOrder('${o.id}')">已送到，完成訂單</button>`;return`<article class="order-row ${available?'available':''}"><div class="order-top"><div><strong>訂單 #${esc(o.public_code||o.id)}</strong><small>${new Date(o.created_at).toLocaleString('zh-HK')} · ${esc(o.payment_method||'未選付款')}</small></div><span class="pill ${esc(o.status)}">${statusLabel(o.status)}</span></div><div class="items">${formatItems(o)}</div><div class="meta"><span>送餐地址：<b>${esc(o.address||'未填寫')}</b></span><span>聯絡電話：<b>${esc(o.phone||'未填寫')}</b></span><span>訂單合計：<b>$${esc(o.total||0)}</b></span>${o.note?`<span>備註：<b>${esc(o.note)}</b></span>`:''}${o.assigned_courier_name?`<span>送遞員：<b>${esc(o.assigned_courier_name)}</b></span>`:''}</div>${action?`<div class="order-actions">${action}</div>`:''}</article>`}
function render(){const available=orders.filter(o=>!o.assigned_courier_id&&['confirmed','preparing'].includes(o.status));const mine=orders.filter(o=>o.assigned_courier_id===user.id&&o.status==='delivering');const done=orders.filter(o=>o.assigned_courier_id===user.id&&o.status==='completed').slice(0,20);document.getElementById('statAvailable').textContent=available.length;document.getElementById('statMine').textContent=mine.length;document.getElementById('statDone').textContent=done.length;document.getElementById('availableList').innerHTML=available.length?available.map(o=>orderCard(o,'available')).join(''):'<div class="empty">暫時沒有可接的配送訂單。</div>';document.getElementById('mineList').innerHTML=mine.length?mine.map(o=>orderCard(o,'mine')).join(''):'<div class="empty">你目前沒有配送中的訂單。</div>';document.getElementById('doneList').innerHTML=done.length?done.map(o=>orderCard(o,'done')).join(''):'<div class="empty">暫時沒有完成紀錄。</div>'}
async function claimOrder(id){if(!confirm('確定接下這張訂單並開始配送？'))return;const {error}=await db.rpc('courier_claim_order',{p_order_id:id});if(error){toast(error.message?.includes('no longer')?'這張訂單已被其他送遞員接走。':'接單失敗，請重新整理。');await loadOrders();return}toast('接單成功，請開始配送。');await loadOrders()}
async function completeOrder(id){if(!confirm('確認已將訂單送到客人手上？'))return;const {error}=await db.rpc('courier_complete_order',{p_order_id:id});if(error){toast('未能完成訂單，請重新整理。');return}toast('訂單已標記為完成。');await loadOrders()}
function subscribe(){channel=db.channel(`taway-courier-${user.id}`).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe()}
async function logout(){if(channel&&db)await db.removeChannel(channel);if(db)await db.auth.signOut();user=null;profile=null;orders=[];document.getElementById('app').style.display='none';document.getElementById('loginView').style.display='grid'}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.classList.remove('show'),2200)}
</script></body></html>
