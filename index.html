const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function loadCloud(){if(!db)return;const {data,error}=await db.from('restaurants').select('*,menu_items(*)').eq('active',true).order('id');if(error||!data?.length)return;restaurants=data.map(r=>normalize({id:r.id,name:r.name,category:r.category,area:r.area,time:r.delivery_time,fee:r.delivery_fee_label,rating:r.rating,reviews:r.review_count,cover:r.cover,emoji:r.emoji,label:r.label,tags:r.tags,active:r.active,menu:(r.menu_items||[]).filter(m=>m.active!==false).map(m=>({id:m.id,name:m.name,desc:m.description,price:m.price,emoji:m.emoji,category:m.category}))}));renderRestaurants()}
function renderRestaurants(){const q=document.getElementById('search').value.trim().toLowerCase(),list=restaurants.filter(r=>r.active!==false&&(category==='全部'||r.category===category||category==='飲品'&&r.category==='茶飲'||r.menu.some(m=>(m.category||'其他')===category))&&(!q||`${r.name}${r.area}${r.category}${r.tags.join('')}${r.menu.map(m=>m.name).join('')}`.toLowerCase().includes(q))),box=document.getElementById('restaurantGrid');if(!list.length){box.innerHTML='<div class="empty">搵唔到相關店舖，不如試下其他搜尋？</div>';return}box.innerHTML=list.map(r=>`<article class="card"><div class="cover ${esc(r.cover)}"><span class="cover-label">${esc(r.label)}</span><span class="cover-emoji">${esc(r.emoji)}</span></div><div class="card-body"><div class="card-top"><h3>${esc(r.name)}</h3><span class="rating">★ ${esc(r.rating)} (${esc(r.reviews)})</span></div><div class="meta"><span>⌖ ${esc(r.area)}</span><span>◷ ${esc(r.time)}</span><span>運費 ${esc(r.fee)}</span></div><div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><button class="order-btn" onclick="openMenu(${r.id})">睇吓食咩　→</button></div></article>`).join('')}
function setCat(btn){category=btn.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));btn.classList.add('on');renderRestaurants()}
function openMenu(id){current=restaurants.find(r=>r.id===id);if(!current)return;document.getElementById('menuTitle').textContent=current.name;document.getElementById('menuSub').textContent=`${current.area} · ${current.time} · ${current.rating} 分`;const cats=['全部',...new Set(current.menu.map(m=>m.category||'其他'))];document.getElementById('menuCats').innerHTML=cats.map(c=>`<button class="menu-cat${c==='全部'?' on':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('#menuCats .menu-cat').forEach(btn=>btn.onclick=()=>renderMenuItems(btn.dataset.category));renderMenuItems('全部');document.getElementById('menuOverlay').classList.add('open')}
function renderMenuItems(cat='全部'){if(!current)return;document.querySelectorAll('#menuCats .menu-cat').forEach(btn=>btn.classList.toggle('on',btn.dataset.category===cat));const list=current.menu.filter(m=>cat==='全部'||(m.category||'其他')===cat),box=document.getElementById('menuList');box.innerHTML=list.length?list.map(m=>`<div class="menu-row"><div class="thumb">${esc(m.emoji)}</div><div class="menu-info"><strong>${esc(m.name)}</strong><span class="menu-category">${esc(m.category||'其他')}</span><small>${esc(m.desc)}</small><b>$${m.price}</b></div><button class="add" onclick="addCartById(${current.id},${JSON.stringify(m.id)})">＋</button></div>`).join(''):'<div class="empty">這個分類暫時沒有餐點。</div>'}
function addCartById(restaurantId,itemId){const r=restaurants.find(x=>String(x.id)===String(restaurantId)),m=r?.menu.find(x=>String(x.id)===String(itemId));if(!r||!m)return;const old=cart.find(x=>x.restaurantId===r.id&&x.name===m.name);if(old)old.qty++;else cart.push({restaurantId:r.id,restaurantName:r.name,name:m.name,price:m.price,qty:1});updateBadge();toast(`${m.name} 已加入購物車`)}
function totals(items=cart){const subtotal=items.reduce((s,x)=>s+x.price*x.qty,0),delivery=subtotal>=100?0:8;return{subtotal,delivery,total:subtotal+delivery}}
function updateBadge(){const n=cart.reduce((s,x)=>s+x.qty,0),b=document.getElementById('cartBadge');b.textContent=n;b.style.display=n?'grid':'none'}
function openCart(){closeOverlay('menuOverlay');renderCart();document.getElementById('cartOverlay').classList.add('open')}
function renderCart(){const box=document.getElementById('cartContent');if(!cart.length){box.innerHTML='<div class="empty">購物車仲係空空如也<br><small>去附近小店揀啲好味道啦！</small></div>';return}const t=totals();box.innerHTML=cart.map((x,i)=>`<div class="cart-line"><div><strong>${esc(x.name)}</strong><small>${esc(x.restaurantName)} · $${x.price}</small></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${i},1)">＋</button></div></div>`).join('')+`<div class="totals"><div class="total"><span>餐點小計</span><span>$${t.subtotal}</span></div><div class="total"><span>街坊配送費</span><span>${t.delivery?'$'+t.delivery:'免費'}</span></div><div class="total final"><span>合計</span><span>$${t.total}</span></div></div><button class="primary" onclick="startCheckout()">選擇付款方式　$${t.total}</button>`}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);updateBadge();renderCart()}
function loadCustomerInfo(){let info={};try{info=JSON.parse(localStorage.getItem(CUSTOMER_KEY)||'{}')||{}}catch(e){}document.getElementById('address').value=info.address||'';document.getElementById('phone').value=info.phone||'';document.getElementById('rememberCustomer').checked=true}
function saveCustomerInfo(address,phone){if(document.getElementById('rememberCustomer').checked)localStorage.setItem(CUSTOMER_KEY,JSON.stringify({address,phone}));else localStorage.removeItem(CUSTOMER_KEY)}
function clearCustomerInfo(){localStorage.removeItem(CUSTOMER_KEY);document.getElementById('address').value='';document.getElementById('phone').value='';document.getElementById('rememberCustomer').checked=false;toast('已清除已記住的地址及電話')}
function startCheckout(){if(!cart.length)return;checkout=cart.map(x=>({...x}));const t=totals(checkout);document.getElementById('paymentTotal').textContent='$'+t.total;loadCustomerInfo();document.getElementById('note').value='';setPayment('alipay');closeOverlay('cartOverlay');document.getElementById('paymentOverlay').classList.add('open')}
function setPayment(m){payment=m;document.querySelectorAll('.method').forEach(x=>x.classList.toggle('on',x.dataset.method===m));const info={alipay:'正式版會跳轉至支付寶付款頁面。',wechat:'正式版會跳轉至微信支付付款頁面。',fps:'正式版會顯示你的 FPS 收款識別碼及付款指示。'};document.getElementById('paymentInfo').textContent=info[m]}
async function createOrder(order){if(!db)return{error:new Error('Supabase 未載入')};const id=crypto.randomUUID(),{error}=await db.from('orders').insert({id,public_code:order.code,payment_method:order.paymentMethod,address:order.address,phone:order.phone,note:order.note,subtotal:order.subtotal,delivery_fee:order.delivery,total:order.total,status:'pending'});if(error)return{error};const {error:itemError}=await db.from('order_items').insert(order.items.map(x=>({order_id:id,restaurant_id:x.restaurantId,restaurant_name:x.restaurantName,item_name:x.name,quantity:x.qty,unit_price:x.price})));return{error:itemError||null,trackingToken:id}}
async function confirmOrder(){const address=document.getElementById('address').value.trim(),phone=document.getElementById('phone').value.trim();if(!address||!phone){toast('請填寫送餐地址及聯絡電話');return}saveCustomerInfo(address,phone);const t=totals(checkout),names={alipay:'支付寶',wechat:'微信支付',fps:'轉數快'},order={code:'TW'+Date.now().toString().slice(-6),createdAt:new Date().toISOString(),status:'pending',paymentMethod:names[payment],address,phone,note:document.getElementById('note').value.trim(),items:checkout.map(x=>({...x})),...t},result=await createOrder(order);if(result.error){toast('暫時未能送出雲端訂單，請稍後再試');console.error(result.error);return}order.trackingToken=result.trackingToken;const old=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');old.unshift(order);localStorage.setItem(ORDER_KEY,JSON.stringify(old));cart=[];checkout=[];updateBadge();closeOverlay('paymentOverlay');document.getElementById('successText').textContent=`訂單 ${order.code} 已送出，付款方式：${order.paymentMethod}。現正等待餐廳後台確認接單。`;document.getElementById('successOverlay').classList.add('open');renderActive();connectOrderTracking(order)}
function activeOrder(){try{return JSON.parse(localStorage.getItem(ORDER_KEY)||'[]')[0]}catch(e){return null}}
function saveActiveOrder(order){const all=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');const i=all.findIndex(x=>x.code===order.code);if(i>=0)all[i]=order;else all.unshift(order);localStorage.setItem(ORDER_KEY,JSON.stringify(all))}
async function connectOrderTracking(order){if(!db||!order)return;if(trackingChannel){await db.removeChannel(trackingChannel);trackingChannel=null}let query=db.from('order_tracking').select('order_id,status,public_code,updated_at');query=order.trackingToken?query.eq('order_id',order.trackingToken):query.eq('public_code',order.code);const {data,error}=await query.maybeSingle();if(error){console.error(error);return}if(!data)return;if(!order.trackingToken)order.trackingToken=data.order_id;if(data.status&&data.status!==order.status){order.status=data.status;order.updatedAt=data.updated_at;saveActiveOrder(order);renderActive()}trackingChannel=db.channel(`taway-track-${data.order_id}`).on('postgres_changes',{event:'UPDATE',schema:'public',table:'order_tracking',filter:`order_id=eq.${data.order_id}`},payload=>{const status=payload.new?.status;if(!status)return;const latest=activeOrder();if(!latest||latest.code!==order.code)return;latest.status=status;latest.updatedAt=payload.new.updated_at;latest.trackingToken=data.order_id;saveActiveOrder(latest);renderActive();toast(`訂單狀態更新：${statusLabel(status)}`)}).subscribe()}
async function loadActiveOrderTracking(){const order=activeOrder();if(order)await connectOrderTracking(order)}
function statusLabel(status){return({pending:'待確認',confirmed:'已確認',preparing:'準備中',delivering:'配送中',completed:'已完成',cancelled:'已取消'})[status]||'待確認'}
function renderActive(){const o=activeOrder(),box=document.getElementById('activeOrder');if(!o){box.classList.remove('show');return}const labels={pending:'待確認',confirmed:'已確認',preparing:'準備中',delivering:'配送中',completed:'已完成',cancelled:'已取消'},notes={pending:'訂單已送出，等待餐廳確認。',confirmed:'餐廳已確認接單，正在安排製作。',preparing:'餐廳正在準備餐點。',delivering:'街坊車手已出發，請留意電話。',completed:'訂單已完成，多謝支持天水圍小店！',cancelled:'此訂單已取消，如有疑問請聯絡店舖。'};box.classList.add('show');document.getElementById('activeMeta').textContent=`訂單 #${o.code} · $${o.total}`;document.getElementById('activeTitle').textContent=labels[o.status]||'待確認';document.getElementById('activeStatus').textContent=labels[o.status]||'待確認';document.getElementById('activeNote').textContent=notes[o.status]||notes.pending}
function closeOverlay(id){document.getElementById(id).classList.remove('open')}function backdrop(e,id){if(e.target.id===id)closeOverlay(id)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;t.style.transform='translate(-50%,0)';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{t.style.opacity=0;t.style.transform='translate(-50%,20px)'},2200)}
window.addEventListener('storage',e=>{if(e.key===ORDER_KEY){renderActive();loadActiveOrderTracking()}});renderRestaurants();updateBadge();renderActive();loadCloud();loadActiveOrderTracking();
</script></body></html>
